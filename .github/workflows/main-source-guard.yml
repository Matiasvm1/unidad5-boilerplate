name: Main source guard

# Pull requests into main are only accepted from development.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  require-development-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the source branch is development
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "development" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from development of this repository (got '$HEAD_REPO:$HEAD_REF')."
            exit 1
          fi
          echo "Source branch is development."
